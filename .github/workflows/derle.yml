name: Windows exe derle ve yayınla

# GitHub'da "v1.2.3" etiketli bir sürüm yayınlandığında testler çalışır, exe derlenir ve
# o sürüme eklenir. Program "Güncellemeleri denetle" ile buradan günceller.
on:
  release:
    types: [published]
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber==0.11.10 openpyxl==3.1.5 reportlab pytest
      - run: python -m pytest -q

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt pyinstaller
      - name: Sürüm numarasını etiketten yaz
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os
          v = os.environ["GITHUB_REF_NAME"].lstrip("vV")
          with open("nobet/version.py", "w", encoding="utf-8") as f:
              f.write(f'__version__ = "{v}"\n')
      - name: Exe derle
        run: pyinstaller --noconfirm --onefile --windowed --name NobetGorevlendirme run.py
      - uses: actions/upload-artifact@v4
        with:
          name: NobetGorevlendirme
          path: dist/NobetGorevlendirme.exe
      - name: Sürümü yayınla
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NobetGorevlendirme.exe
          body_path: SURUM_NOTLARI.md
