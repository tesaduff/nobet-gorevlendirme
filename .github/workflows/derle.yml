name: Windows exe derle ve yayınla

# main'e her gönderimde testler çalışır. nobet/version.py içindeki sürüm henüz
# yayınlanmamışsa Windows exe'si derlenir ve "v<sürüm>" adıyla GitHub Releases'a
# yüklenir. Program "Güncellemeleri denetle" ile buradan günceller.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pdfplumber==0.11.10 openpyxl==3.1.5 reportlab pytest
      - run: python -m pytest -q

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sürüm numarasını oku
        id: ver
        shell: python
        run: |
          import os, re
          src = open("nobet/version.py", encoding="utf-8").read()
          v = re.search(r'__version__\s*=\s*"([^"]+)"', src).group(1)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={v}\n")
      - name: Bu sürüm daha önce yayınlandı mı?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.ver.outputs.version }} zaten yayınlı; derleme atlandı."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.exists == 'false'
        with:
          python-version: "3.12"
      - name: Bağımlılıkları kur
        if: steps.check.outputs.exists == 'false'
        run: pip install -r requirements.txt pyinstaller
      - name: Exe derle
        if: steps.check.outputs.exists == 'false'
        run: pyinstaller --noconfirm --onefile --windowed --name NobetGorevlendirme run.py
      - name: Sürümü yayınla
        if: steps.check.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/NobetGorevlendirme.exe
          body_path: SURUM_NOTLARI.md
